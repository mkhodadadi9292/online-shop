[project]
name = "shop-shared"
version = "0.1.0"
description = "Shared contracts, settings, and utilities for the online shop microservices"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
