server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Path-based routing to the backend microservices. Inside the compose/K8s
    # network each service listens on its own port 8000.
    location /api/users    { proxy_pass http://user-service:8000; }
    location /api/products { proxy_pass http://catalog-service:8000; }
    location /api/inventory{ proxy_pass http://inventory-service:8000; }
    location /api/orders   { proxy_pass http://order-service:8000; }
    location /api/payments { proxy_pass http://payment-service:8000; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
