# The five microservices. Images are assumed to be built from the per-service
# Dockerfiles and pushed to a registry; adjust the image refs to match yours.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: shop/user-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://postgres:postgres@postgres:5432/users_db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shop-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shop
spec:
  selector:
    app: user-service
  ports:
    - port: 8000
---
